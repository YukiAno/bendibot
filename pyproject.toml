[project]
name = "bendibot"
version = "0.1.0"
description = "QQ 聊天机器人：NapCat + NoneBot2 + nonebot-plugin-llmchat"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-llmchat>=0.6.0",
    # 下面这个只有「组卡」功能用，是可选的：
    # 不装也能正常跑，发「组卡」会提示缺依赖，其余功能全不受影响。
    # 装了之后首次使用某个区服会下载该区服的 masterdata。
    # "allium-sekai-deck>=0.0.5",
]

[tool.nonebot]
# 适配器：OneBot v11（对接 NapCat）
adapters = ["~onebot.v11"]

# 启用的插件
plugins = ["nonebot_plugin_llmchat"]

# 本地插件目录（以后自己写的插件放这里）
plugin_dirs = ["plugins"]

# 内置插件（echo 用于连调测试，可按需删除）
builtin_plugins = ["echo"]